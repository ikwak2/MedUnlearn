[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medunlearn"
version = "0.1.0"
description = "Reproduction code for class-wise evaluation of unlearnable medical images"
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
medunlearn = "medunlearn.cli:main"

[tool.setuptools]
packages = ["medunlearn"]

[tool.setuptools.data-files]
"share/medunlearn/configs" = ["configs/source_provenance.json", "configs/table3.json"]
"share/medunlearn/engines/artifacts" = ["engines/artifacts/common.py", "engines/artifacts/tsne.py"]
"share/medunlearn/engines/common" = ["engines/common/benchmark.py", "engines/common/benchmark_cifar_sgd.py", "engines/common/benchmark_fixed.py", "engines/common/classwise_metrics.py", "engines/common/generate_advanced.py", "engines/common/generate_gue.py", "engines/common/generate_simple.py", "engines/common/loss_weights.py"]
"share/medunlearn/engines/figures" = ["engines/figures/aa_case.py", "engines/figures/aa_loss.py", "engines/figures/aa_native.py", "engines/figures/mixing.py", "engines/figures/native_case.py", "engines/figures/run_case.py", "engines/figures/util.py"]
"share/medunlearn/engines/reference/ar" = ["engines/reference/ar/ar_coefficients.json", "engines/reference/ar/ar_generation.py", "engines/reference/ar/classwise_metrics.py", "engines/reference/ar/experiment.py"]
"share/medunlearn/engines/reference/ar/ar_official" = ["engines/reference/ar/ar_official/LICENSE"]
"share/medunlearn/engines/reference/ar/ar_official/models" = ["engines/reference/ar/ar_official/models/resnet.py"]
"share/medunlearn/engines/reference/ar/official" = ["engines/reference/ar/official/LICENSE"]
"share/medunlearn/engines/reference/ar/official/attacks" = ["engines/reference/ar/official/attacks/step.py"]
"share/medunlearn/engines/reference/ar/official/models" = ["engines/reference/ar/official/models/resnet.py", "engines/reference/ar/official/models/vgg.py"]
"share/medunlearn/engines/reference/p1" = ["engines/reference/p1/ar_coefficients.json", "engines/reference/p1/ar_generation.py", "engines/reference/p1/classwise_metrics.py", "engines/reference/p1/experiment.py"]
"share/medunlearn/engines/reference/p1/ar_official" = ["engines/reference/p1/ar_official/LICENSE"]
"share/medunlearn/engines/reference/p1/ar_official/models" = ["engines/reference/p1/ar_official/models/resnet.py"]
"share/medunlearn/engines/reference/p1/official" = ["engines/reference/p1/official/LICENSE"]
"share/medunlearn/engines/reference/p1/official/attacks" = ["engines/reference/p1/official/attacks/step.py"]
"share/medunlearn/engines/reference/p1/official/models" = ["engines/reference/p1/official/models/resnet.py", "engines/reference/p1/official/models/vgg.py"]
